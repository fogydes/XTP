[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]
# Fixtures are standalone crates built on demand by integration tests.
exclude = ["tests/fixtures"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
# Internal crates
xtp-core = { path = "crates/xtp-core" }
xtp-pe = { path = "crates/xtp-pe" }
xtp-loader = { path = "crates/xtp-loader" }
xtp-hle = { path = "crates/xtp-hle" }
xtp-gpu = { path = "crates/xtp-gpu" }
xtp-shader = { path = "crates/xtp-shader" }
xtp-formats = { path = "crates/xtp-formats" }
xtp-pipeline = { path = "crates/xtp-pipeline" }
xtp-game = { path = "crates/xtp-game" }
xtp-testkit = { path = "crates/xtp-testkit" }

# External crates
anyhow = "1.0.104"
thiserror = "2.0.21"
clap = { version = "4.6.9", features = ["derive"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.2.2"
object = { version = "0.41.0", default-features = false, features = ["read_core", "pe", "coff", "archive", "std"] }
windows-sys = "0.61.2"
windows = "0.62.2"
windows-core = "0.62.2"
blake3 = "1.8.7"
memchr = "2.8.3"
miniz_oxide = "0.9.1"
# DirectStorage's zlib inflate (Zlib licence, pure Rust): faster than miniz_oxide.
zlib-rs = { version = "0.6.9", default-features = false, features = ["std"] }
walkdir = "2.5.1"
tempfile = "3.27.0"
# Opus decoding for the console's audio decoder (BSD-3-Clause, pure Rust).
opus-pure = "0.2.4"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"

[profile.dev.package."*"]
# Dependencies (hashing, parsing) are hot paths when chewing through
# gigabytes of game data; keep them fast even in debug builds.
opt-level = 2

[profile.release]
debug = "line-tables-only"

# The development build: release code generation plus the `diagnostics`
# feature (`cargo build --profile diag -p xtp --features diagnostics`),
# kept in its own folder so it does not evict the plain release build.
[profile.diag]
inherits = "release"
